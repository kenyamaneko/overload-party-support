{{define "content"}}
<p><a href="/admin/announcements">← 一覧</a></p>

<article>
  <header><strong>新規作成</strong></header>
  <form method="post" action="/admin/announcements">
    <label>
      種別
      <select name="type" required>
        {{range .Types}}<option value="{{.}}">{{.}}</option>{{end}}
      </select>
    </label>
    <div class="grid">
      <label>
        公開開始 (空で下書き)
        <input type="datetime-local" name="published_at">
      </label>
      <label>
        公開終了 (空で無期限)
        <input type="datetime-local" name="expires_at">
      </label>
    </div>
    <label>
      タイトル (ja)
      <input type="text" name="ja_title" required maxlength="200">
    </label>
    <label>
      本文 (ja)
      <textarea name="ja_body" rows="12" required></textarea>
    </label>
    <label>
      タイトル (en) <small>任意</small>
      <input type="text" name="en_title" maxlength="200">
    </label>
    <label>
      本文 (en) <small>任意</small>
      <textarea name="en_body" rows="12"></textarea>
    </label>
    <button type="submit">作成</button>
  </form>
  <p><small>英語は両方入力するか両方空欄にしてください。片方だけ埋めた場合は 400 になります。未入力でも作成後の編集画面から追加できます。</small></p>
</article>
{{end}}
