openapi: 3.0.3
info:
  title: overload-party-support
  version: 0.1.0
  description: |
    Support service の REST 契約 (gateway 経由でクライアントに届く announcements)。
    本ファイルが SSoT。`packages/api-support` (Go) と `packages/api-support-npm` (TS) の型は本ファイルから生成する。

paths:
  /health:
    get:
      operationId: getHealth
      summary: サービス死活監視 (ClusterIP 内部のみ)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/support/announcements:
    get:
      operationId: listAnnouncements
      summary: 公開中のお知らせ一覧を返す (gateway 経由でクライアントに届く)
      parameters:
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: お知らせ一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementListResponse"
        "400":
          description: lang 未指定 / 非対応 lang

  /api/v1/support/announcements/{announcementId}:
    get:
      operationId: getAnnouncement
      summary: ID 指定でお知らせ詳細を返す (期間外・下書きでも返す)
      parameters:
        - $ref: "#/components/parameters/AnnouncementIdPath"
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: お知らせ詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementDetail"
        "400":
          description: lang 未指定 / 非対応 lang
        "404":
          description: 該当お知らせ無し / 指定 lang の翻訳無し

components:
  parameters:
    AnnouncementIdPath:
      name: announcementId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    LangQuery:
      name: lang
      in: query
      required: true
      description: |
        取得言語。許容値は domain.SupportedLangs と同期する
        (drift 検知は本ファイルでは行わず application 層で `IsSupportedLang` が担う)。
      schema:
        type: string

  schemas:
    # ─── Health ────────────────────────────────────────────────────────
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    # ─── Announcement (api/v1) ─────────────────────────────────────────
    AnnouncementListResponse:
      type: object
      required: [announcements]
      properties:
        announcements:
          type: array
          items:
            $ref: "#/components/schemas/AnnouncementSummary"

    AnnouncementSummary:
      description: |
        `GET /api/v1/support/announcements` のレスポンス要素。
        expires_at / body はクライアントに露出させない。
      type: object
      required: [announcement_id, type, title, published_at]
      properties:
        announcement_id:
          type: integer
          format: int64
          x-go-name: AnnouncementID
        type:
          $ref: "#/components/schemas/AnnouncementType"
        title:
          type: string
        published_at:
          type: string
          format: date-time

    AnnouncementDetail:
      description: |
        `GET /api/v1/support/announcements/{announcementId}` のレスポンス。
        published_at は下書きの場合 null、expires_at はクライアントに露出させない。
      type: object
      required: [announcement_id, type, title, body, published_at]
      properties:
        announcement_id:
          type: integer
          format: int64
          x-go-name: AnnouncementID
        type:
          $ref: "#/components/schemas/AnnouncementType"
        title:
          type: string
        body:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true

    # ─── Enums (流出するもの) ──────────────────────────────────────────
    AnnouncementType:
      type: string
      description: お知らせ種別。
      enum:
        - info
        - maintenance
        - event
        - update
