name: CI

# PR の品質ゲート。ブランチ保護の required status check として使う。
on:
  pull_request:
    branches: [main, develop, "release/**"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # golangci-lint-action のビルド済みバイナリは Go 1.25 未対応のため
      # go install でソースからビルドして使う
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      - name: Run lint
        run: golangci-lint run --timeout 5m ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Testcontainers はテスト中に自動 pull するが、時間がかかりタイムアウトの原因になるため事前に取得する
      - name: Pre-pull postgres image (Testcontainers)
        run: docker pull postgres:16-alpine
      - name: Run tests
        run: go test -race -count=1 ./...

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build -t support:ci-scan .
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: support:ci-scan
          exit-code: "1"
          severity: "CRITICAL,HIGH"

  codegen-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.0
      - name: Run codegen (OpenAPI)
        run: scripts/generate_types.sh
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies (schema-doc)
        run: |
          pip install \
            "overload-party-doc-tools @ git+https://github.com/kenyamaneko/overload-party-common.git@main#subdirectory=packages/doc-tools"
      - name: Run schema-doc codegen
        run: python3 scripts/generate_schema_doc.py
      - name: Check for drift
        run: .github/scripts/ci/check-codegen-drift.sh

  spec-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install oasdiff
        run: go install github.com/oasdiff/oasdiff@latest
      - name: Fetch base ref
        run: git fetch origin "${{ github.base_ref }}"
      - name: Detect breaking changes in data/openapi.yaml
        run: .github/scripts/ci/openapi-diff.sh "origin/${{ github.base_ref }}"
